
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AptiQuiz | Race Your Mind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="#" class="logo">Apti<span>Quiz</span></a>
    <div class="nav-tag">LIVE QUIZ ARENA</div>
  </header>

  <main class="hero">
    <div class="pill">⚡ THINK FAST. WIN BIG.</div>

    <h1>Race Your Mind.<br>
      <span>Own The Leaderboard.</span>
    </h1>

    <p class="subtitle">
      Challenge your brain, compete with friends and prove
      your skills in the ultimate aptitude quiz arena.
    </p>

    <div class="stats">
      <div><strong>50</strong><small>Players / Room</small></div>
      <div><strong>LIVE</strong><small>Real-time Quiz</small></div>
      <div><strong>∞</strong><small>Possibilities</small></div>
    </div>

    <section class="action-grid">
      <button class="action-card primary" id="hostBtn">
        <span class="action-icon">＋</span>
        <strong>Host a Quiz</strong>
        <small>Create a room and challenge others</small>
        <span class="arrow">→</span>
      </button>

      <button class="action-card" id="joinBtn">
        <span class="action-icon">↗</span>
        <strong>Join a Room</strong>
        <small>Enter a code to join the competition</small>
        <span class="arrow">→</span>
      </button>

      <button class="action-card" id="practiceBtn">
        <span class="action-icon">◈</span>
        <strong>Quick Practice</strong>
        <small>Sharpen your skills solo</small>
        <span class="arrow">→</span>
      </button>
    </section>

    <section class="panel" id="panel" hidden>
      <h2 id="panelTitle">Welcome</h2>
      <p id="panelText"></p>

      <form id="setupForm">
        <label for="playerName">Your name</label>
        <input id="playerName" maxlength="20"
          placeholder="Enter your name" required>

        <div id="roomField" hidden>
          <label for="roomCode">Room code</label>
          <input id="roomCode" maxlength="6"
            placeholder="Enter room code">
        </div>

        <div id="topicField" hidden>
          <label for="topic">Quiz topic</label>
          <select id="topic">
            <option value="Quantitative Aptitude">Quantitative Aptitude</option>
            <option value="Logical Reasoning">Logical Reasoning</option>
            <option value="Verbal Ability">Verbal Ability</option>
          </select>
        </div>

        <button class="submit-btn" type="submit" id="submitBtn">
          Continue →
        </button>
      </form>

      <div id="message" role="status"></div>
    </section>

    <footer>BUILT FOR THINKERS. MADE FOR WINNERS.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
